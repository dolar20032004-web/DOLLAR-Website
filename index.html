:root{color-scheme:dark;--green:#00ff66;--soft:#9dffbd}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020805;color:#eaffef;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;overflow-x:hidden}
#matrix{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.42}

.portrait{width:min(68vw,260px);aspect-ratio:1/1;object-fit:cover;object-position:center 24%;border-radius:50%;border:3px solid var(--green);padding:5px;box-shadow:0 0 18px rgba(0,255,102,.75),0 0 50px rgba(0,255,102,.22)}

.links{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:20px}

.links a:hover{background:rgba(0,255,102,.18);box-shadow:0 0 18px rgba(0,255,102,.35);transform:translateY(-2px)}
footer{color:#557d62;font-size:11px;letter-spacing:.18em;margin-top:24px}

const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  cols = Math.floor(w / 20) + 1;
  drops = Array(cols).fill(1);
});

const chars = '0101010101010101010101010101010101010101010101010101010101010101';
let cols = Math.floor(w / 20) + 1;
let drops = Array(cols).fill(1);

function draw() {
  ctx.fillStyle = 'rgba(2, 8, 5, 0.08)';
  ctx.fillRect(0, 0, w, h);
  
  ctx.fillStyle = '#00ff66';
  ctx.font = '15px monospace';
  
  for (let i = 0; i < drops.length; i++) {
    const text = chars.charAt(Math.floor(Math.random() * chars.length));
    ctx.fillText(text, i * 20, drops[i] * 20);
    
    if (drops[i] * 20 > h && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}
setInterval(draw, 33);
