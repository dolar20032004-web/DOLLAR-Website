<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020805">
<title>DOLLAR // Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--green:#00ff66;--soft:#9dffbd;--bg:#020805}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#eaffef;font-family:'Share Tech Mono',monospace;overflow-x:hidden}
#matrix{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.82;pointer-events:none}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at center,rgba(0,0,0,.1),rgba(0,0,0,.92))}
main{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 14px 48px}
.view{display:none;width:min(100%,460px);text-align:center;padding:28px 20px;border:1px solid rgba(0,255,102,.45);border-radius:24px;background:rgba(0,12,5,.88);box-shadow:0 0 40px rgba(0,255,102,.15),inset 0 0 30px rgba(0,255,102,.05);backdrop-filter:blur(8px);animation:fadeIn .4s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.kicker{color:var(--soft);letter-spacing:.3em;font-size:clamp(10px,2.8vw,13px);margin:0 0 8px;text-shadow:0 0 10px var(--green)}
h1{color:var(--green);font-size:clamp(34px,9vw,52px);letter-spacing:.12em;margin:0;text-shadow:0 0 10px #00ff66,0 0 30px rgba(0,255,102,.5)}
.line{width:90px;height:2px;background:var(--green);box-shadow:0 0 12px var(--green);margin:14px auto 18px}
.portrait{width:min(50vw,170px);height:min(50vw,170px);object-fit:cover;object-position:center 28%;border-radius:50%;border:3px solid var(--green);padding:3px;background:#020805;box-shadow:0 0 20px rgba(0,255,102,.75),0 0 50px rgba(0,255,102,.25);margin:0 auto 16px;display:block}
h2{font-size:clamp(23px,6vw,30px);margin:10px 0 18px}
.bio{color:#a8cbb4;line-height:1.6;margin:0 auto 20px;max-width:360px;font-size:clamp(13px,3.5vw,16px)}
.buttons-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.buttons-grid a,.buttons-grid button,.back-btn{color:var(--green);text-decoration:none;border:1px solid rgba(0,255,102,.65);border-radius:14px;padding:12px 10px;font-size:clamp(13px,3.5vw,16px);font-family:'Share Tech Mono',monospace;transition:.3s;text-align:center;background:rgba(0,255,102,.05);cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:54px}
.buttons-grid a:hover,.buttons-grid button:hover,.back-btn:hover{background:rgba(0,255,102,.2);box-shadow:0 0 18px rgba(0,255,102,.4);transform:translateY(-2px)}
.back-btn{margin-top:12px;width:100%;display:block}
.terminal-box{border:1px dashed rgba(0,255,102,.35);padding:14px;border-radius:14px;background:rgba(0,20,8,.6);margin-bottom:16px;text-align:left}
.en-text{color:var(--green);font-size:13px;margin:0 0 8px;text-shadow:0 0 8px rgba(0,255,102,.4);direction:ltr;line-height:1.6}
.ar-text{color:#9dffbd;font-size:13px;margin:0;direction:rtl;border-top:1px solid rgba(0,255,102,.2);padding-top:8px;line-height:1.7}
footer{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#557d62;font-size:10px;letter-spacing:.15em;z-index:2;pointer-events:none}
@media(max-width:360px){.view{padding:24px 14px}.buttons-grid{gap:8px}}
</style>
</head>
