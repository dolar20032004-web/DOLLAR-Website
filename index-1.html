<style>
:root{color-scheme:dark;--green:#00ff66;--soft:#9dffbd}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020805;color:#eaffef;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;overflow-x:hidden}#matrix{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.42}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.18),rgba(0,0,0,.82))}
main{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:38px 18px}
.profile{width:min(100%,560px);text-align:center;padding:34px 24px;border:1px solid rgba(0,255,102,.42);border-radius:24px;background:rgba(0,12,5,.78);box-shadow:0 0 35px rgba(0,255,102,.13),inset 0 0 28px rgba(0,255,102,.045);backdrop-filter:blur(7px)}
.kicker{color:var(--soft);letter-spacing:.32em;font-size:12px;margin:0 0 13px;text-shadow:0 0 12px var(--green)}
h1{color:var(--green);font-size:clamp(42px,11vw,68px);letter-spacing:.14em;margin:0;text-shadow:0 0 9px #00ff66,0 0 30px rgba(0,255,102,.5)}
.line{width:105px;height:2px;background:var(--green);box-shadow:0 0 12px var(--green);margin:18px auto 24px}
.portrait{width:min(68vw,260px);aspect-ratio:1/1;object-fit:cover;object-position:center 24%;border-radius:50%;border:3px solid var(--green);padding:5px;box-shadow:0 0 18px rgba(0,255,102,.75),0 0 50px rgba(0,255,102,.22)}
h2{margin:24px 0 8px;color:#d9ffe5;font-size:clamp(17px,4vw,21px);letter-spacing:.08em}
.bio{color:#a8cbb4;line-height:1.7;margin:0 auto 24px;max-width:390px;font-size:14px}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.links a{color:var(--green);text-decoration:none;border:1px solid rgba(0,255,102,.65);border-radius:999px;padding:11px 18px;font-size:14px;transition:.2s}
.links a:hover{background:rgba(0,255,102,.13);box-shadow:0 0 18px rgba(0,255,102,.35);transform:translateY(-2px)}
footer{color:#557d62;font-size:11px;letter-spacing:.18em;margin-top:28px}
@media(max-width:420px){.profile{padding:29px 16px}.portrait{width:210px}}
</style></head><body>
